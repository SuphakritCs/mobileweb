<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Lab04 – Photo Gallery App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Prompt,sans-serif;
  background:linear-gradient(135deg,#e8f8f1,#ffffff);
  overflow-x:hidden;
}

/* Splash */
#splash{
  position:fixed;
  inset:0;
  background:#27ae60;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:#fff;
  z-index:999;
  animation:fadeOut 1s ease 3s forwards;
}
#splash img{
  width:90vw;
  max-width:500px;
}
#splash h1{margin-top:20px}

/* Container */
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
  animation:fadeIn 1s ease;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

/* Profile Card */
.card{
  background:#fff;
  border-radius:24px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  margin-bottom:24px;
  text-align:center;
}

/* Horizontal Gallery */
.gallery{
  display:flex;
  gap:18px;
  overflow-x:auto;
  padding:10px;
}
.gallery img{
  width:260px;
  border-radius:18px;
  box-shadow:0 8px 18px rgba(0,0,0,.25);
  flex-shrink:0;
  transition:.3s;
}
.gallery img:hover{transform:scale(1.05)}

/* Download Button */
.download{
  display:block;
  background:#27ae60;
  color:#fff;
  padding:18px;
  border-radius:16px;
  text-decoration:none;
  font-size:20px;
  margin:30px auto 0;
  width:320px;
  box-shadow:0 8px 18px rgba(0,0,0,.3);
  transition:.3s;
}
.download:hover{background:#219150;transform:translateY(-3px)}
</style>

</head>

<body>

<!-- Splash Screen -->
<div id="splash">
  <img src="welcome.gif">
  <h1>Welcome</h1>
  <p>Photo Gallery App</p>
</div>

<div class="container">

<div class="card profile">
  <h3>663380403-1</h3>
  <p>นายศุภกฤต สังข์มณีวงศ์</p>
</div>

<div class="card gallery">
  <img src="screen1.jpg">
  <img src="screen2.jpg">
  <img src="screen3.jpg">
  <img src="screen4.jpg">
  <img src="screen5.jpg">
</div>

<a class="download" href="app-debug.apk">⬇ ดาวน์โหลดแอป (APK)</a>

</div>
</body>
</html>
