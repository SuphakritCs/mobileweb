<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Lab04 – Photo Gallery App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --green:#27ae60;
  --dark:#145a32;
}

body{
  margin:0;
  font-family:Prompt,sans-serif;
  background:linear-gradient(135deg,#e8f8f1,#ffffff);
  overflow-x:hidden;
}

/* Splash */
#splash{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#27ae60,#145a32);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:#fff;
  z-index:999;
}
#splash img{width:90vw;max-width:520px}
#splash.hide{animation:fadeOut 1s ease forwards}

/* Main */
.main{opacity:0;animation:fadeIn 1.2s ease 2.8s forwards}

@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes fadeIn{to{opacity:1}}

/* Header Card */
.hero{
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(12px);
  border-radius:30px;
  padding:30px;
  box-shadow:0 12px 35px rgba(0,0,0,.2);
  text-align:center;
  margin:30px auto;
  max-width:500px;
}

/* Gallery */
.gallery-wrap{margin:30px auto;max-width:1200px}
.gallery{
  display:flex;
  gap:22px;
  overflow-x:auto;
  padding:20px;
}
.gallery img{
  width:260px;
  border-radius:22px;
  box-shadow:0 10px 25px rgba(0,0,0,.3);
  flex-shrink:0;
  transition:.3s;
}
.gallery img:hover{transform:scale(1.08)}

/* Download */
.download{
  display:block;
  width:340px;
  margin:40px auto;
  padding:18px;
  background:linear-gradient(135deg,#27ae60,#145a32);
  color:#fff;
  text-decoration:none;
  text-align:center;
  border-radius:18px;
  font-size:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
  transition:.3s;
}
.download:hover{transform:translateY(-4px)}
</style>
</head>

<body>

<!-- Splash -->
<div id="splash">
  <img src="welcome.gif">
  <h1>Welcome</h1>
  <p>Ionic Photo Gallery</p>
</div>

<div class="main">

<div class="hero">
  <h2>Lab04 – Photo Gallery App</h2>
  <p>663380403-1 นายศุภกฤต สังข์มณีวงศ์</p>
</div>

<div class="gallery-wrap">
  <div class="gallery">
    <img src="screen1.jpg">
    <img src="screen2.jpg">
    <img src="screen3.jpg">
    <img src="screen4.jpg">
    <img src="screen5.jpg">
  </div>
</div>

<a class="download" href="app-debug.apk"> ⬇ ดาวน์โหลดแอป (APK)</a>

</div>

<script>
setTimeout(()=>document.getElementById('splash').classList.add('hide'),2500)
</script>

</body>
</html>
