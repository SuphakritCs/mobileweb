<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Lab05 – Ionic React Photo Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --green:#2ecc71;
  --dark:#145a32;
  --glass: rgba(255,255,255,.18);
  --blur: blur(14px);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Prompt,sans-serif;
  background:
    radial-gradient(1200px 600px at 10% 10%, rgba(46,204,113,.25), transparent 60%),
    radial-gradient(800px 500px at 90% 20%, rgba(39,174,96,.25), transparent 60%),
    linear-gradient(135deg,#e8f8f1,#ffffff);
  overflow-x:hidden;
  color:#1b4332;
}

/* SPLASH */
#splash{
  position:fixed; inset:0; z-index:999;
  background:linear-gradient(135deg,#2ecc71,#145a32);
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  color:#fff; text-align:center;
}
#splash img{width:min(90vw,520px); filter: drop-shadow(0 12px 30px rgba(0,0,0,.35));}
#splash.hide{animation:fadeOut .9s ease forwards}

@keyframes fadeOut{to{opacity:0;visibility:hidden}}

/* MAIN */
.main{opacity:0; animation:fadeIn 1.2s ease 2.4s forwards}
@keyframes fadeIn{to{opacity:1}}

/* HERO GLASS CARD */
.hero{
  max-width:560px; margin:36px auto 20px; padding:26px 26px 28px;
  background:var(--glass); backdrop-filter:var(--blur);
  border-radius:28px;
  box-shadow:0 14px 40px rgba(0,0,0,.22);
  text-align:center;
}
.hero h2{margin:.2em 0 .3em; font-weight:700}
.hero .badge{
  display:inline-block; padding:6px 12px; border-radius:999px;
  background:rgba(46,204,113,.2); color:#145a32; font-size:13px;
  border:1px solid rgba(46,204,113,.35);
}

/* STATS */
.stats{
  display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
  max-width:760px; margin:14px auto 10px; padding:0 16px;
}
.stat{
  background:rgba(255,255,255,.9); border-radius:18px; padding:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.15); text-align:center;
}
.stat b{font-size:20px}

/* GALLERY */
.gallery-wrap{margin:18px auto 6px; max-width:1200px}
.gallery{
  display:flex; gap:20px; overflow-x:auto; padding:18px 18px 28px;
  scroll-snap-type:x mandatory;
}
.gallery img{
  width:260px; aspect-ratio:9/16; object-fit:cover;
  border-radius:22px; box-shadow:0 12px 28px rgba(0,0,0,.3);
  flex-shrink:0; transition:.35s; scroll-snap-align:center;
}
.gallery img:hover{transform:translateY(-6px) scale(1.06)}

/* DOWNLOAD CTA */
.download{
  display:block; width:360px; margin:28px auto 44px; padding:18px 20px;
  background:linear-gradient(135deg,#2ecc71,#145a32);
  color:#fff; text-decoration:none; text-align:center; border-radius:18px;
  font-size:20px; box-shadow:0 14px 32px rgba(0,0,0,.35);
  transition:.3s; position:relative; overflow:hidden;
}
.download:hover{transform:translateY(-4px)}
.download::after{
  content:""; position:absolute; inset:0; transform:translateX(-120%);
  background:linear-gradient(110deg,transparent 30%, rgba(255,255,255,.45), transparent 60%);
  transition:.6s;
}
.download:hover::after{transform:translateX(120%)}

/* FOOTER NOTE */
.note{
  text-align:center; opacity:.7; padding-bottom:24px; font-size:13px;
}

/* MOBILE */
@media (max-width:520px){
  .stats{grid-template-columns:1fr}
  .download{width:90%}
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <img src="welcome.gif" alt="Welcome">
  <h1>Welcome</h1>
  <p>Ionic React • Photo Gallery</p>
</div>

<div class="main">

  <div class="hero">
    <span class="badge">WEEK 5 • IONIC REACT</span>
    <h2>Lab05 – Photo Gallery App</h2>
    <p>663380403-1 นายศุภกฤต สังข์มณีวงศ์</p>
  </div>

  <!-- QUICK STATS -->
  <div class="stats">
    <div class="stat"><b>Camera</b><div>Native</div></div>
    <div class="stat"><b>Storage</b><div>Persistent</div></div>
    <div class="stat"><b>Delete</b><div>Supported</div></div>
  </div>

  <!-- HORIZONTAL GALLERY -->
  <div class="gallery-wrap">
    <div class="gallery">
      <img src="screen1.jpg" alt="">
      <img src="screen2.jpg" alt="">
      <img src="screen3.jpg" alt="">
      <img src="screen4.jpg" alt="">
    </div>
  </div>

  <!-- CTA -->
  <a class="download" href="app-debug.apk">⬇ ดาวน์โหลดแอป (APK)</a>

  <div class="note">Best viewed on mobile • Built with Ionic React</div>
</div>

<script>
  setTimeout(()=>document.getElementById('splash').classList.add('hide'),2300)
</script>

</body>
</html>
